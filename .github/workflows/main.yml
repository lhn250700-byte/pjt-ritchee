name: Build and Deploy to EC2

# 워크플로우가 언제 실행될 것인지 조건 명시
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# AWS 관련 값 변수로 설정
env:
  AWS_REGION: ap-northeast-2
  AWS_S3_BUCKET: test-deploy-bucket-test
  AWS_CODE_DEPLOY_APPLICATION: test-application
  AWS_CODE_DEPLOY_GROUP: test-deploy-grp

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # JDK 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 공개되면 안되는 정보를 담은 yml파일 생성
      - name: make application.yml
        run: |
          mkdir -p ./src/main/resources
          cd ./src/main/resources
          touch ./application.yml
          touch ./application-common.yml
          touch ./application-prod.yml
          echo "${{ secrets.APPLICATION }}" > ./application.yml
          echo "${{ secrets.COMMON }}" > ./application-common.yml
          echo "${{ secrets.PROD }}" > ./application-prod.yml
        working-directory: ./pjt-ritchee-back

      # 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        shell: bash
        working-directory: ./pjt-ritchee-back

      - name: Build and Test
        run: ./gradlew clean build -x test
        working-directory: ./pjt-ritchee-back

      # [수정] 파일 위치를 수동으로 지정하지 않고, 자동 검색(find) 방식으로 변경합니다.
      - name: Ready for Deploy
        run: |
          mkdir -p deploy-package
          
          # 1. plain이 붙지 않은 진짜 실행 가능한 JAR 파일을 프로젝트 전체에서 찾아 복사합니다.
          find . -name "*-SNAPSHOT.jar" ! -name "*-plain.jar" -exec cp {} deploy-package/ \;
          
          # 2. 만약 SNAPSHOT 명칭이 없다면, plain을 제외한 모든 jar 파일을 검색해서 복사합니다.
          if [ ! -f deploy-package/*.jar ]; then
            find . -name "*.jar" ! -name "*-plain.jar" -exec cp {} deploy-package/ \;
          fi
          
          # 3. 배포 설계도와 스크립트 폴더 복사
          cp appspec.yml deploy-package/
          cp -r scripts deploy-package/
          
          # 복사가 잘 되었는지 깃허브 액션스 로그창에 목록을 출력해 확인합니다.
          echo ">>> 디플로이 패키지 구성 완료 목록:"
          ls -al deploy-package/
        shell: bash

      # [수정 2] 모아놓은 알맹이 폴더 안으로 이동해서 그것만 가볍게 압축하기
      - name: Make zip file
        run: |
          cd deploy-package
          zip -r ../$GITHUB_SHA.zip .
        shell: bash

      # AWS 권한
      - name: AWS credential 설정
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.CICD_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.CICD_SECRET_KEY }}

      # S3 버킷에 빌드파일(zip 파일)을 빌드
      - name: Upload to S3
        run: aws s3 cp --region ap-northeast-2 ./$GITHUB_SHA.zip s3://$AWS_S3_BUCKET/$GITHUB_SHA.zip

      # EC2 인스턴스에 S3에 저장되어 있던 zip 파일을 받아와 배포 시작
      - name: EC2에 배포
        run: aws deploy create-deployment --application-name ${{ env.AWS_CODE_DEPLOY_APPLICATION }} --deployment-config-name CodeDeployDefault.AllAtOnce --deployment-group-name ${{ env.AWS_CODE_DEPLOY_GROUP }} --s3-location bucket=$AWS_S3_BUCKET,key=$GITHUB_SHA.zip,bundleType=zip