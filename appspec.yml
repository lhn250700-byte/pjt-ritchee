version: 0.0
os: linux

files:
  # [수정] 압축 파일 루트에 있는 알맹이들을 EC2의 /home/ubuntu/app 폴더로 바로 보냅니다.
  - source: /
    destination: /home/ubuntu/app
    overwrite: yes

permissions:
  - object: /home/ubuntu/app
    pattern: "**"
    owner: ubuntu
    group: ubuntu

hooks:
  ApplicationStart:
    # [수정] 압축 파일 루트에 scripts 폴더가 바로 있으므로 앞의 폴더명을 뗍니다.
    - location: scripts/deploy.sh
      timeout: 300
      runas: ubuntu